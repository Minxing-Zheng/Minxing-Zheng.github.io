- date: Oct 2026
  text: "Two new preprints:"
  bullets:
    - "**[CASA](/publication/sample-efficient-generative-conformal-prediction)** adaptively allocates generated samples across inputs, making generative conformal prediction more sample-efficient."
    - "**[AdaCF](/publication/decision-focused-calibration)** adapts conformal predictive distributions to downstream decisions while keeping finite-sample calibration."
